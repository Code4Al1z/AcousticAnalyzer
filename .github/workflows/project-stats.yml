name: Project stats

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build project-stats.json
        run: |
          python3 - <<'PY'
          import json, subprocess, datetime
          out = subprocess.run(
              ["git", "log", "--format=%ad|%an", "--date=short"],
              capture_output=True, text=True, check=True
          ).stdout.strip().splitlines()
          rows = [l.split("|", 1) for l in out if l]
          rows = [r for r in rows if "[bot]" not in r[1]]
          dates = sorted(datetime.date.fromisoformat(r[0]) for r in rows)
          days = sorted(set(dates))
          weeks = {d.isocalendar()[:2] for d in days}
          stats = {
              "commits": len(rows),
              "activeDays": len(days),
              "activeWeeks": len(weeks),
              "first": days[0].isoformat(),
              "last": days[-1].isoformat(),
          }
          with open("project-stats.json", "w") as f:
              json.dump(stats, f, indent=2)
              f.write("\n")
          PY

      - name: Publish to project-stats branch
        run: |
          mkdir /tmp/stats
          cp project-stats.json /tmp/stats/
          cd /tmp/stats
          git init -q -b project-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-stats.json
          git commit -q -m "Update project stats"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" project-stats
