name: Build macOS plugins

on:
  push:
    tags: ['v*', 'v*.*', 'v*.*.*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout — MUST include submodules so modules/JUCE is present
      # ---------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------
      # 2. Install CMake
      # ---------------------------------------------------------------
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.24.x'

      # ---------------------------------------------------------------
      # 3. Import Developer ID certificate from GitHub Secrets
      #    Secrets required in your repo (Settings → Secrets → Actions):
      #      MACOS_CERTIFICATE        — base64-encoded .p12 file
      #      MACOS_CERTIFICATE_PWD    — password for the .p12
      #      APPLE_TEAM_ID            — 10-character Team ID (e.g. AB12CD34EF)
      #      NOTARY_APPLE_ID          — your Apple ID email
      #      NOTARY_PASSWORD          — app-specific password from appleid.apple.com
      # ---------------------------------------------------------------
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign

          # Allow codesign to use it without UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Make this keychain the default search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      # ---------------------------------------------------------------
      # 4. Configure with CMake (Xcode generator for AU support)
      # ---------------------------------------------------------------
      - name: Configure with CMake
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCODESIGN_IDENTITY="Developer ID Application" \
            -DDEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      # ---------------------------------------------------------------
      # 5. Build Release
      # ---------------------------------------------------------------
      - name: Build plugins
        run: |
          cmake --build build --config Release --parallel 4

      # ---------------------------------------------------------------
      # 6. Collect built plugins
      #    JUCE CMake places artefacts under:
      #    build/<TargetName>_artefacts/Release/<FORMAT>/
      # ---------------------------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find build -name "*.vst3"      -exec cp -R {} artifacts/ \;
          find build -name "*.component" -exec cp -R {} artifacts/ \;
          ls -laR artifacts

      # ---------------------------------------------------------------
      # 7. Notarize
      #    Zips each bundle, submits to Apple notary, waits for result,
      #    then staples the ticket back onto the bundle.
      # ---------------------------------------------------------------
      - name: Notarize VST3
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd artifacts
          if [ -d AcousticAnalyzer.vst3 ]; then
            zip -r AcousticAnalyzer.vst3.zip AcousticAnalyzer.vst3
            xcrun notarytool submit AcousticAnalyzer.vst3.zip \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple AcousticAnalyzer.vst3
          fi

      - name: Notarize AU
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd artifacts
          if [ -d AcousticAnalyzer.component ]; then
            zip -r AcousticAnalyzer.component.zip AcousticAnalyzer.component
            xcrun notarytool submit AcousticAnalyzer.component.zip \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple AcousticAnalyzer.component
          fi

      # ---------------------------------------------------------------
      # 8. Package into a DMG for distribution
      # ---------------------------------------------------------------
      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "AcousticAnalyzer ${{ github.ref_name }}" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            "AcousticAnalyzer-${{ github.ref_name }}-macOS.dmg" \
            artifacts/ || true

      # ---------------------------------------------------------------
      # 9. Upload final artifacts
      # ---------------------------------------------------------------
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AcousticAnalyzer-macOS-${{ github.ref_name || github.run_id }}
          path: "*.dmg"
          if-no-files-found: warn

      - name: Upload plugin bundles (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: AcousticAnalyzer-bundles-${{ github.ref_name || github.run_id }}
          path: artifacts/
          if-no-files-found: error
